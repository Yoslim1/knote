name: Update lint baseline

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  update-baseline:
    name: Regenerate app/lint-baseline.xml
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Generate lint baseline
        run: ./gradlew :app:updateLintBaseline --stacktrace

      - name: Upload generated baseline
        uses: actions/upload-artifact@v4
        with:
          name: lint-baseline
          path: app/lint-baseline.xml
          retention-days: 14
